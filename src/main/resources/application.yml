spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-client-id}  # Replace with your actual ID
            client-secret: ${GOOGLE_CLIENT_SECRET:your-client-secret}  # Replace with your actual secret
            scope:
              - email
              - profile
  datasource:
    url: jdbc:mysql://localhost:3306/auth_demo
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update

logging:
  level:
    org.springframework.security: DEBUG